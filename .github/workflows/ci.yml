name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff check
        run: ruff check mapachespim/

      - name: Run ruff format check
        run: ruff format --check mapachespim/

      - name: Run mypy
        run: mypy mapachespim/ --ignore-missing-imports

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu/windows are x86 (Keystone installed automatically);
        # macos-14 is Apple Silicon, where Keystone has no wheel, so it
        # covers the "no Keystone" install that many students will have.
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      # Install the built wheel (not an editable checkout) so packaging
      # mistakes, like files missing from the wheel, fail CI.
      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl pytest

      - name: Smoke test the installed package outside the repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -ex
          python -c "import mapachespim, pathlib; p = pathlib.Path(mapachespim.__file__); assert 'site-packages' in str(p), p"
          mapachespim --version
          mapachespim-as --version
          mapachespim -e riscv/hello_asm
          mapachespim -e mips/hello_asm
          mapachespim -e arm/hello_asm
          mapachespim -e x86_64/hello_asm
          mapachespim --copy-examples ex
          mapachespim -e ex/riscv/fibonacci/fibonacci.s
          mapachespim -e ex/mips/fibonacci/fibonacci.s
          printf 'load riscv/fibonacci\nbreak fibonacci\nrun\nregs\nlist\nquit\n' | mapachespim

      - name: Install GNU binutils for the assembler differential tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-riscv64-linux-gnu binutils-mips-linux-gnu binutils-aarch64-linux-gnu

      - name: Run tests
        run: python -m pytest tests/ --tb=short

  assembler-fuzz:
    # The built-in assemblers must produce byte-identical
    # output to GNU as. This runs the randomized comparison much deeper
    # than the regular test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GNU binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-riscv64-linux-gnu binutils-mips-linux-gnu binutils-aarch64-linux-gnu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compare with GNU as (50x fuzz scale)
        env:
          MAPACHESPIM_FUZZ_SCALE: "50"
        run: python -m pytest tests/test_differential_*.py --tb=short
