[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapachespim"
version = "0.2.0"
description = "SPIM-like educational simulator and assembler for RISC-V, MIPS, ARM64, and x86-64"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MapacheSPIM Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Assembly",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Emulators",
]
dependencies = [
    "pyelftools>=0.29",
    "unicorn>=2.0.0",
    "capstone>=5.0.0",
    # Keystone assembles ARM64/x86-64/MIPS (RISC-V uses a built-in encoder).
    # Its PyPI release only ships prebuilt wheels for x86 machines, so it is
    # installed automatically only there; elsewhere pip would have to compile
    # it from source. Use the "keystone" extra to try that explicitly.
    "keystone-engine>=0.9.2; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'i686' or platform_machine == 'x86'",
]

[project.optional-dependencies]
keystone = [
    "keystone-engine>=0.9.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
mapachespim = "mapachespim.console:main"
mapachespim-as = "mapachespim.toolchain.cli:main"

[project.urls]
Homepage = "https://github.com/UCSBarchlab/MapacheSPIM"
Documentation = "https://github.com/UCSBarchlab/MapacheSPIM#readme"
Repository = "https://github.com/UCSBarchlab/MapacheSPIM.git"
Issues = "https://github.com/UCSBarchlab/MapacheSPIM/issues"

[tool.hatch.build.targets.wheel]
packages = ["mapachespim"]

# Ship the example programs inside the package so they work after pip install
[tool.hatch.build.targets.wheel.force-include]
"examples" = "mapachespim/examples"

[tool.hatch.build.targets.sdist]
include = ["mapachespim", "examples", "tests", "docs", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F841",   # unused variable (some are intentional for future use)
    "SIM102", # nested if statements (sometimes clearer for complex conditions)
    "SIM105", # contextlib.suppress (try-except-pass is clearer in some contexts)
    "SIM108", # use ternary operator (sometimes less readable)
    "SIM116", # dictionary instead of if statements (sometimes less readable)
    "SIM118", # dict instead of dict.keys() (explicit is better)
    "UP006",  # use dict/list instead of Dict/List (typing names kept for consistency)
    "UP007",  # use X | Y instead of Union[X, Y] (needs Python 3.10)
    "UP045",  # use X | None instead of Optional[X] (needs Python 3.10)
    "UP035",  # typing.Dict etc. are deprecated aliases (kept for consistency)
    "B904",   # raise from (valid but would change exception semantics)
]

[tool.ruff.lint.isort]
known-first-party = ["mapachespim"]

[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
# Allow calling methods on Optional types where we know they're set
# (e.g., self.sim is always set after __init__)
disable_error_code = ["union-attr", "no-any-return", "override", "misc", "return-value", "operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["mapachespim"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
